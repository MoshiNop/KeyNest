name: github pages

on:
  push:
    branches:
      - stable
      - beta
      - web-beta

jobs:
  deploy:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: ci-install-deps
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: "./keynest/_tools/ci-install-deps.sh linux"
      - name: Build
        id: build
        env:
          GIT_AUTHOR_NAME: 'Github Action CI'
          GIT_AUTHOR_EMAIL: 'herbert.github.ci@codeux.design'
          GIT_COMMITTER_NAME: 'Github Action CI'
          GIT_COMMITTER_EMAIL: 'herbert.github.ci@codeux.design'
        run: "./keynest/_tools/ci-release.sh web"
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./keynest/build/web
          allow_empty_commit: true

